<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090f">
<title>Astral Spire: GBA / Inotia Pixel Action-RPG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="gba-bezel">
    <canvas id="game" width="800" height="450"></canvas>
  </div>
</div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="bK" class="gba-btn" title="Attack (K / B)">K</div>
  <div id="bD" class="gba-btn" title="Dodge Roll (D / R)">D</div>
  <div id="bL" class="gba-btn" title="Skill / Ult (L)">L</div>
  <div id="bJ" class="gba-btn" title="Interact / Sprint (J / A)">J</div>
  <div id="bMusic" class="gba-btn" title="Toggle Music">🎵</div>
  <div id="bP" class="gba-btn" title="Pause / Menu">II</div>
</div>

<div id="rotate">Rotate your device to landscape<br>for the full GBA / Inotia RPG experience!</div>
<input type="file" id="imp" accept=".json,application/json" style="display:none">

<script src="game.js"></script>
</body>
</html>
