<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Astral Spire: Climb to Floor 100</title>
<meta name="description" content="An action RPG dungeon crawler. Climb to Floor 100 of the Astral Spire with Zodiac Guilds, procedural music, elemental combos, and dark steel biomes.">
<meta property="og:title" content="Astral Spire: Climb to Floor 100">
<meta property="og:description" content="An action RPG dungeon crawler. Climb to Floor 100 of the Astral Spire with Zodiac Guilds, procedural music, elemental combos, and dark steel biomes.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="450"></canvas></div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="bK" class="btn" title="Attack (K)">K</div>
  <div id="bD" class="btn" title="Dodge Dash (D)">D</div>
  <div id="bL" class="btn" title="Guild Skill / Ultimate (L)">L</div>
  <div id="bJ" class="btn" title="Interact / Sprint (J)">J</div>
  <div id="bMusic" class="btn" title="Toggle Music">🎵</div>
  <div id="bP" class="btn" title="Pause Menu">II</div>
</div>

<div id="rotate">Rotate your device to landscape<br>to enter the Astral Spire.</div>
<input type="file" id="imp" accept=".json,application/json" style="display:none">

<script src="game.js"></script>
</body>
</html>
