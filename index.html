<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Astral Spire: Climb to Floor 100</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);image-rendering:pixelated;background:#000;touch-action:none;display:block}

  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
  body.touch #touch{display:block}
  #joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
    width:136px;height:136px;border-radius:50%;background:rgba(160,200,255,.10);border:2px solid rgba(160,200,255,.40);
    pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:rgba(190,225,255,.45);border:2px solid rgba(255,255,255,.6);pointer-events:none}
  .btn{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    font:bold 28px "Courier New",monospace;color:#fff;background:rgba(160,200,255,.14);border:2px solid rgba(160,200,255,.55)}
  .btn.on{background:rgba(255,255,255,.35)}
  #bJ{width:76px;height:76px;right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px))}
  #bK{width:76px;height:76px;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  #bP{width:42px;height:42px;font-size:15px;right:calc(14px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px))}

  #rotate{position:fixed;inset:0;background:#05060d;color:#cfe6ff;font:bold 18px "Courier New",monospace;display:none;
    align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="450"></canvas></div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="bK" class="btn">K</div>
  <div id="bJ" class="btn">J</div>
  <div id="bP" class="btn">II</div>
</div>

<div id="rotate">Rotate your phone to landscape<br>to climb the Astral Spire.</div>
<input type="file" id="imp" accept=".json,application/json" style="display:none">

<script src="game.js"></script>
</body>
</html>
